<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>${title} — Shifts</title>
<link rel="stylesheet" href="assets/workspace.css" />
<style>
  :root { color-scheme: dark; --bg:#0b1220; --card:#131c2e; --line:#22304a; --fg:#e6edf7; --mut:#8aa0c0; --acc:#38bdf8; --ok:#34d399; --warn:#f59e0b; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif; }
  /* Jobs listed inside a shift are read, not opened. */
  .job-line { display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .job-line:first-of-type { border-top:0; padding-top:0; }
  .job-line b { flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere; }
</style>
</head>
<body>
<header class="wk-head">
  <a class="back" href="compliance" aria-label="Back to the compliance hub"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6a1 1 0 0 1 0 1.4L9.4 12l6 6a1 1 0 0 1-1.4 1.4l-6.7-6.7a1 1 0 0 1 0-1.4L14 4.6a1 1 0 0 1 1.4 0z"/></svg></a>
  <hgroup>
    <h1>Shifts</h1>
    <p id="sub">Who is clocked on, and what they took the vehicle out with</p>
  </hgroup>
  <button class="wk-btn" id="refreshBtn" type="button">Refresh</button>
</header>

<main class="wk-main">
  <div class="wk-stats" id="stats"></div>

  <div class="wk-search">
    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 0 4.9 14.3l4.4 4.4a1 1 0 0 0 1.4-1.4l-4.4-4.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
    <input id="q" type="search" placeholder="Search driver or registration" autocomplete="off" aria-label="Search driver or registration" />
  </div>

  <div class="wk-chips" id="tabs" role="tablist">
    <button class="wk-chip on" type="button" data-tab="active" role="tab">On shift <span id="cActive">0</span></button>
    <button class="wk-chip" type="button" data-tab="history" role="tab">History <span id="cHistory">0</span></button>
  </div>

  <p class="wk-count" id="count"></p>
  <div class="wk-list" id="list"></div>
</main>

<div class="wk-sheet" id="sheet" hidden>
  <div class="wk-sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="wk-sheet-head">
      <h2 id="sheetTitle">Shift</h2>
      <button class="wk-btn" type="button" id="sheetClose">Close</button>
    </div>
    <div class="wk-sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
// Same-origin: works at /tacho/<page> behind Apache and at :8000/<page> directly.
const API = location.pathname.replace(/\/[^\/]*$/, '') + '/api/shifts';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

let active = [], history = [], tab = 'active', query = '';

const ICON = {
  clock: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm1 3a1 1 0 1 0-2 0v5.4l3.3 2a1 1 0 0 0 1-1.7L13 11.4z"/></svg>',
  timer: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M7 2h10v4.2c0 1.3-.6 2.5-1.7 3.3L13 11.2a1 1 0 0 0 0 1.6l2.3 1.7c1.1.8 1.7 2 1.7 3.3V22H7v-4.2c0-1.3.6-2.5 1.7-3.3l2.3-1.7a1 1 0 0 0 0-1.6L8.7 9.5A4.1 4.1 0 0 1 7 6.2z"/></svg>',
  person: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4 0-8 2-8 4.5V21h16v-2.5c0-2.5-4-4.5-8-4.5z"/></svg>',
  road: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8.4 3h2.1l-.3 18H6zm7.2 0h-2.1l.3 18H18zM12 4.6h1.4v3.2H12zm0 5.8h1.4v3.2H12zm0 5.8h1.4v3.2H12z"/></svg>',
  fuel: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M4 3h8a2 2 0 0 1 2 2v15H2V5a2 2 0 0 1 2-2zm1 3v4h6V6zm11 1.5 2.6 2.6a2 2 0 0 1 .6 1.4V17a1 1 0 0 0 2 0v-5.5a4 4 0 0 0-1.2-2.8L17.4 6z"/></svg>',
  photo: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 12h14l-4.5-6-3.5 4.5L9 13z"/></svg>',
};

async function api(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// --- the shapes a shift can be in -----------------------------------------
const STATE = {
  active:      { label: 'On shift',    rail: 'ok',   badge: 'ok' },
  on_break:    { label: 'On break',    rail: 'warn', badge: 'warn' },
  clocked_out: { label: 'Clocked out', rail: 'mut',  badge: '' },
};
const stateOf = s => STATE[s.status] || { label: (s.status || '').replace('_', ' '), rail: 'mut', badge: '' };

const time = iso => iso ? new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' }) : '—';
const day = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { timeZone: 'Europe/London', day: '2-digit', month: 'short' }) : '—';
const stamp = iso => iso ? `${day(iso)} ${time(iso)}` : '—';

function spanOf(s) {
  if (!s.clocked_in_at) return null;
  const end = s.clocked_out_at ? new Date(s.clocked_out_at) : new Date();
  const mins = Math.max(0, Math.round((end - new Date(s.clocked_in_at)) / 60000));
  return `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, '0')}m`;
}
const num = (v, unit) => v == null ? '—' : `${Number(v).toLocaleString('en-GB')}${unit || ''}`;
function delta(a, b, unit) {
  if (a == null || b == null) return null;
  const d = Math.round((b - a) * 10) / 10;
  return `${d > 0 ? '+' : ''}${d.toLocaleString('en-GB')}${unit || ''}`;
}
function plate(reg) {
  return reg ? `<span class="wk-plate"><i>UK</i><b>${esc(reg)}</b></span>` : '';
}
const meta = (icon, text) => `<span>${icon}${text}</span>`;

// --- list -----------------------------------------------------------------
function visible() {
  const rows = tab === 'active' ? active : history;
  if (!query) return rows;
  const q = query.toLowerCase();
  return rows.filter(s => (s.driver_name || '').toLowerCase().includes(q) || (s.vehicle_reg || '').toLowerCase().includes(q));
}

function render() {
  const rows = visible();
  const today = new Date().toDateString();
  const finished = history.filter(s => s.clocked_out_at && new Date(s.clocked_out_at).toDateString() === today).length;
  const vehicles = new Set(active.map(s => s.vehicle_reg).filter(Boolean)).size;
  $('stats').innerHTML = [
    ['On shift', active.filter(s => s.status === 'active').length, 'ok'],
    ['On break', active.filter(s => s.status === 'on_break').length, 'warn'],
    ['Finished today', finished, ''],
    ['Vehicles out', vehicles, ''],
  ].map(([k, v, kind]) => `<div class="wk-stat ${v ? kind : ''}"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');

  $('cActive').textContent = `(${active.length})`;
  $('cHistory').textContent = `(${history.length})`;
  $('count').textContent = `${rows.length} ${rows.length === 1 ? 'shift' : 'shifts'}`
    + (query ? ` matching “${query}”` : '');

  if (!rows.length) {
    $('list').innerHTML = `<p class="wk-empty">${query ? 'Nothing matches that search.'
      : tab === 'active' ? 'Nobody is clocked on right now.' : 'No finished shifts yet.'}</p>`;
    return;
  }

  $('list').innerHTML = rows.map(s => {
    const st = stateOf(s);
    const bits = [];
    if (tab === 'active') {
      bits.push(meta(ICON.clock, `On since <b>${time(s.clocked_in_at)}</b>`));
      if (spanOf(s)) bits.push(meta(ICON.timer, `<b>${spanOf(s)}</b> on shift`));
      if (s.odometer_km != null) bits.push(meta(ICON.road, `<b>${num(s.odometer_km, ' km')}</b> out`));
      if (s.fuel_level_pct != null) bits.push(meta(ICON.fuel, `<b>${s.fuel_level_pct}%</b> fuel out`));
    } else {
      bits.push(meta(ICON.clock, `${day(s.clocked_in_at)} <b>${time(s.clocked_in_at)}–${time(s.clocked_out_at)}</b>`));
      if (spanOf(s)) bits.push(meta(ICON.timer, `<b>${spanOf(s)}</b>`));
      const run = delta(s.odometer_km, s.odometer_out_km, ' km');
      if (run) bits.push(meta(ICON.road, `<b>${run}</b> driven`));
      const used = delta(s.fuel_level_pct, s.fuel_level_out_pct, '%');
      if (used) bits.push(meta(ICON.fuel, `<b>${used}</b> fuel`));
    }
    return `<button class="wk-item" type="button" data-rail="${st.rail}" data-id="${s.id}">
      <span class="wk-top">
        ${plate(s.vehicle_reg)}
        <span class="wk-title">${esc(s.driver_name)}</span>
        <span class="wk-spacer"></span>
        <span class="wk-badge ${st.badge}">${st.label}</span>
      </span>
      <span class="wk-meta">${bits.join('')}</span>
    </button>`;
  }).join('');
}

async function load() {
  const [a, h] = await Promise.all([
    api('/active').catch(() => []),
    api('/history').catch(() => []),
  ]);
  active = a; history = h;
  render();
}

// --- one shift ------------------------------------------------------------
// What the vehicle went out with, and what came back. While the shift is still
// running there is only the "out with" half, so that is what the figure shows.
function snapshot(s) {
  const pct = v => v == null ? '—' : v + '%';
  const rows = [
    ['Driven', delta(s.odometer_km, s.odometer_out_km, ' km'), s.odometer_out_km == null
      ? `Out at ${num(s.odometer_km, ' km')}`
      : `${num(s.odometer_km)} → ${num(s.odometer_out_km, ' km')}`, num(s.odometer_km, ' km')],
    ['Fuel', delta(s.fuel_level_pct, s.fuel_level_out_pct, '%'), s.fuel_level_out_pct == null
      ? 'Out with ' + pct(s.fuel_level_pct) : `${pct(s.fuel_level_pct)} → ${pct(s.fuel_level_out_pct)}`, pct(s.fuel_level_pct)],
    ['AdBlue', delta(s.adblue_level_pct, s.adblue_level_out_pct, '%'), s.adblue_level_out_pct == null
      ? 'Out with ' + pct(s.adblue_level_pct) : `${pct(s.adblue_level_pct)} → ${pct(s.adblue_level_out_pct)}`, pct(s.adblue_level_pct)],
  ];
  return `<div class="wk-figs">${rows.map(([k, change, sub, fallback]) =>
    `<div><span class="k">${k}</span><span class="v">${change || fallback}</span><span class="s">${sub}</span></div>`).join('')}</div>`;
}

async function openShift(id) {
  const s = await api('/' + id).catch(() => null);
  if (!s) return;
  const st = stateOf(s);
  $('sheetTitle').innerHTML = `${esc(s.driver_name)} <span class="wk-badge ${st.badge}" style="margin-left:6px">${st.label}</span>`;

  const parts = [];
  parts.push(`<section class="wk-sect">
    <h3>Shift${s.vehicle_reg ? '' : ' — no vehicle recorded'}<span class="wk-spacer"></span></h3>
    <dl class="wk-kvs">
      ${s.vehicle_reg ? `<div class="wk-kv"><dt>Vehicle</dt><dd>${plate(s.vehicle_reg)}</dd></div>` : ''}
      <div class="wk-kv"><dt>Clocked in</dt><dd>${stamp(s.clocked_in_at)}</dd></div>
      <div class="wk-kv"><dt>Clocked out</dt><dd>${stamp(s.clocked_out_at)}</dd></div>
      <div class="wk-kv"><dt>${s.clocked_out_at ? 'Length' : 'On shift for'}</dt><dd>${spanOf(s) || '—'}</dd></div>
      ${s.break_started_at ? `<div class="wk-kv"><dt>Break</dt><dd>${time(s.break_started_at)}–${s.break_ended_at ? time(s.break_ended_at) : 'now'}</dd></div>` : ''}
    </dl>
  </section>`);

  parts.push(`<section class="wk-sect"><h3>Vehicle snapshot</h3>${snapshot(s)}</section>`);

  if (s.photos && s.photos.length) {
    parts.push(`<section class="wk-sect">
      <h3>Photos ${ICON.photo}<span class="wk-spacer"></span>${s.photos.length}</h3>
      <div class="wk-photos">${s.photos.map(p => `<figure>
        <img src="${API}/photos/${p.id}" loading="lazy" alt="${esc((p.photo_type || '').replace(/_/g, ' '))}" />
        <figcaption>${esc((p.photo_type || '').replace(/_/g, ' '))}</figcaption></figure>`).join('')}</div>
    </section>`);
  }

  if (s.jobs && s.jobs.length) {
    const JOB_BADGE = { pending: 'warn', accepted: 'ok', in_progress: 'info', completed: '', denied: 'bad', cancelled: '' };
    parts.push(`<section class="wk-sect">
      <h3>Jobs on this shift<span class="wk-spacer"></span>${s.jobs.length}</h3>
      ${s.jobs.map(j => `<div class="job-line">
        <span class="wk-ref">${esc(j.ref || '')}</span><b>${esc(j.title)}</b>
        <span class="wk-badge ${JOB_BADGE[j.status] || ''}" style="text-transform:capitalize">${esc((j.status || '').replace('_', ' '))}</span>
      </div>`).join('')}
    </section>`);
  } else {
    parts.push(`<section class="wk-sect"><h3>Jobs on this shift</h3><p style="margin:0;color:var(--mut);font-size:13.5px">No jobs were linked to this shift.</p></section>`);
  }

  $('sheetBody').innerHTML = parts.join('');
  $('sheet').hidden = false;
  $('sheetClose').focus();
}

function closeSheet() { $('sheet').hidden = true; }

// --- wiring ---------------------------------------------------------------
$('list').addEventListener('click', e => {
  const item = e.target.closest('.wk-item');
  if (item) openShift(item.dataset.id);
});
$('tabs').addEventListener('click', e => {
  const chip = e.target.closest('.wk-chip');
  if (!chip) return;
  tab = chip.dataset.tab;
  [...$('tabs').children].forEach(c => c.classList.toggle('on', c === chip));
  render();
});
$('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });
$('refreshBtn').addEventListener('click', load);
$('sheetClose').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

load();
setInterval(load, 15000);
</script>
</body>
</html>
