        ${st.shift.company && companies().length > 1 ? `<div style="margin-top:8px">${coChip(st.shift.company)}</div>` : ""}
        <div class="stat-grid" style="margin-top:14px"><div class="stat"><div class="n" data-since="${esc(st.shift.clocked_in_at)}" data-fmt="short"></div><div class="l">On shift</div></div>
        <div class="stat"><div class="n">${open}</div><div class="l">Open jobs</div></div><div class="stat"><div class="n">${done}</div><div class="l">Done today</div></div></div>
        <a class="btn btn-primary" href="#/live" style="margin-top:14px;text-decoration:none">Go to Live</a>`
      : `<div class="card-title">No active shift</div><p class="mut" style="margin:0 0 12px">Start a shift from Live by searching for your vehicle.</p><a class="btn btn-ok" href="#/live" style="text-decoration:none">Start Shift</a>`}
    </div>
    ${recs && recs.items.some((i) => i.status !== "missing") ? `<div class="section-title">Licence &amp; qualifications</div>
    <div class="card">${recs.items.filter((i) => i.status !== "missing").map((i) => {
        const when = i.date || i.next_due;
        const colour = ["expired", "overdue"].includes(i.status) ? "var(--d-bad)" : i.status === "due_soon" ? "var(--d-warn)" : "var(--d-fg-2)";
        const detail = i.hours != null ? `${i.hours} of ${i.required} hours` : when ? new Date(when + "T12:00:00Z").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }) : "";
        const label = i.label === "Licence check" ? "Next licence check" : i.label;
        return `<div class="list-item"><div style="flex:1">${esc(label)}</div><div style="color:${colour};font-weight:600;font-size:14px">${esc(detail)}${["expired", "overdue"].includes(i.status) ? " · overdue" : i.status === "due_soon" ? " · soon" : ""}</div></div>`;
      }).join("")}</div>` : ""}
    <div class="section-title">Recent shifts</div>
    <div class="card">${(hist || []).length ? hist.map((s) => `<div class="list-item"><span class="plate">${esc(fmtReg(s.vehicle_reg))}</span>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(fmtWhen(s.clocked_in_at))}</div><div class="mut small">${s.clocked_out_at ? "Ended " + esc(fmtTime(s.clocked_out_at)) + " · " + fmtDuration(new Date(s.clocked_out_at) - new Date(s.clocked_in_at), false) : "In progress"}</div></div>
      ${s.odometer_km != null && s.odometer_out_km != null ? `<span class="mut small">${(s.odometer_out_km - s.odometer_km).toLocaleString()} km</span>` : ""}</div>`).join("") : `<div class="empty">No shifts yet</div>`}</div>`;
  $$("[data-fmt=short]").forEach((el) => { el.dataset.fmt = "short"; });
  const tick = () => $$("[data-fmt=short]").forEach((el) => { el.textContent = fmtDuration(Date.now() - new Date(el.dataset.since), false); });
  S.timers.push(setInterval(tick, 30000)); tick();
}

// ---------- DOCUMENTS ----------
async function renderDocuments(tab = "paperwork") {
  setTopbar({ title: "Documents", avatar: true, bell: true }); setNav("documents");
  const view = $("#view");
  view.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  let docs;
  try { [docs] = await Promise.all([api("GET", "api/driver/documents?days=60"), S.state ? null : loadState()]); } catch (e) { return fail(e); }
  if (!location.hash.startsWith("#/documents")) return;
  const KIND = { job_sheet: "Job sheet", pod: "POD", receipt: "Receipt", other: "Document" };
  const PHASE = { pre_use: "Pre-use check", end_of_day: "End of day check", fault_report: "Fault report" };
  const lists = {
    paperwork: docs.paperwork.map((p) => `<div class="list-item"><span class="ai teal" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center">${ICON.doc}</span>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(KIND[p.kind] || p.kind)}${p.vehicle_reg ? ` · ${esc(fmtReg(p.vehicle_reg))}` : ""}</div><div class="mut small">${esc(fmtWhen(p.created_at))}${p.note ? " · " + esc(p.note) : ""}</div></div>
      <a href="#" data-file="paperwork/${esc(p.id)}">View</a></div>`),
    walkarounds: docs.walkarounds.map((c) => `<div class="list-item"><span class="ai ${c.result === "pass" ? "ok" : "bad"}" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center">${c.result === "pass" ? ICON.shieldCheck : ICON.warn}</span>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${esc(PHASE[c.phase] || "Walkaround")} · ${esc(fmtReg(c.vehicle_reg))}</div><div class="mut small">${esc(fmtWhen(c.created_at))} · ${c.result === "pass" ? "No faults" : "Faults reported"}</div></div></div>`),
    fuel: docs.fuel.map((f) => `<div class="list-item"><span class="ai primary" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center">${ICON.fuel}</span>
      <div style="flex:1"><div style="font-weight:600;font-size:14px">${f.litres != null ? esc(f.litres) + " L" : ""} ${esc(f.fuel_type === "adblue" ? "AdBlue" : "Diesel")} · ${esc(fmtReg(f.vehicle_reg))}</div><div class="mut small">${esc(fmtWhen(f.created_at))}${f.cost != null ? " · £" + Number(f.cost).toFixed(2) : ""}</div></div>
      ${f.has_receipt ? `<a href="#" data-file="fuel/${esc(f.id)}">Receipt</a>` : ""}</div>`),
  };
  const draw = () => {
    view.innerHTML = `<div class="tabs">${[["paperwork", "Paperwork"], ["walkarounds", "Checks"], ["fuel", "Fuel"]].map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? "on" : ""}">${l} (${lists[k].length})</button>`).join("")}</div>
      ${tab === "paperwork" ? `<button class="btn btn-primary" id="upBtn" style="margin-bottom:14px">${ICON.doc} Upload Paperwork</button>` : ""}
      <div class="card">${lists[tab].length ? lists[tab].join("") : `<div class="empty">Nothing in the last 60 days</div>`}</div>`;
    $$("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; draw(); });
    const up = $("#upBtn"); if (up) up.onclick = () => openPaperwork();
    $$("[data-file]").forEach((a) => a.onclick = (e) => { e.preventDefault(); openFile(a.dataset.file); });
  };
  draw();
}

// Files need the sign-in header, so fetch them and open the blob.
function openFile(path) { return fetchAndOpen("api/driver/files/" + path, path.replace("/", "-")); }
async function fetchAndOpen(apiPath, baseName) {
  if (window.flutter_inappwebview) {
    // Inside the mobile app: hand the file to the app to save/share.
    try {
      const r = await fetch(BASE + apiPath, { headers: { Authorization: "Bearer " + S.token } });
      if (!r.ok) throw new Error("Couldn't open that file.");
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = baseName + "." + ((blob.type.split("/")[1] || "bin").replace("jpeg", "jpg"));
      a.click();
    } catch (e) { fail(e); }
    return;
  }
  const win = window.open("", "_blank");
  try {
    const r = await fetch(BASE + apiPath, { headers: { Authorization: "Bearer " + S.token } });
    if (!r.ok) throw new Error("Couldn't open that file.");
    const url = URL.createObjectURL(await r.blob());
    if (win) win.location = url; else location.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { if (win) win.close(); fail(e); }
}

// ---------- HOURS (the driver's own tachograph card data) ----------
function fmtMins(m) { m = Math.max(0, Math.round(m || 0)); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; }
async function renderHours() {
  clearTimers();   // re-rendered every minute while live data is showing
  setTopbar({ title: "My Hours", avatar: true, bell: true }); setNav("hours");
  const view = $("#view");
  view.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  let t;
  let signoffs = [];
  try { [t, signoffs] = await Promise.all([api("GET", "api/driver/tacho?days=28"), api("GET", "api/driver/infringements").catch(() => [])]); } catch (e) { return fail(e); }
  if (!location.hash.startsWith("#/hours")) return;
  if (!t.linked) {
    view.innerHTML = `<div class="card" style="margin-top:8px"><div class="card-title">${ICON.clock} Tachograph hours</div>
      ${t.reason === "no_card_number"
        ? `<p class="mut" style="margin:0">Your hours show here once your driver login is linked to your <b>driver card number</b>.</p>
           <p class="mut small" style="margin:10px 0 0">Ask your transport office to set your driver ID in DH FleetView (Settings → Drivers → Identifier) to the 16-character number on your driver card.</p>`
        : `<p class="mut" style="margin:0">Your login is linked to your driver card, but no card download has been received yet.</p>
           <p class="mut small" style="margin:10px 0 0">Your hours appear after your office next downloads your driver card.</p>`}
    </div>`;
    return;
  }
  const days = t.days || [];
  const DAY_MIN = 1440;
  const lv = t.live, lf = (lv && lv.figures) || {};
  const ACT = { drive: "Driving", work: "Other work", available: "Available", rest: "Break / rest" };
  // The tachograph's own weekly figures (all card data) win over what's been downloaded here.
  const weekDriven = lf.weekly_driving != null ? lf.weekly_driving : (t.this_week_drive_minutes || 0);
  const weekLeft = lf.driving_left_week != null ? lf.driving_left_week : Math.max(0, 3360 - weekDriven);
  const leftStat = (m, warnAt, label) => `<div class="stat"><div class="n ${m == null ? "" : m <= 0 ? "out" : m <= warnAt ? "low" : ""}">${m == null ? "—" : fmtMins(m)}</div><div class="l">${label}</div></div>`;
  const liveCard = lv ? `<div class="card live-card">
      <div class="row between"><div class="card-title" style="margin:0"><span class="live-dot" style="background:${lv.stale ? "var(--d-mut)" : "var(--d-ok)"}"></span> Live from your tachograph</div>
        <span class="mut small">${esc(fmtReg(lv.vehicle_reg || lv.vehicle_name || ""))}</span></div>
      <div style="margin-top:8px;font-size:18px;font-weight:700">${esc(ACT[lv.activity] || "No activity")}${lv.since ? `<span class="mut small" style="font-weight:400"> since ${esc(fmtTime(lv.since))}</span>` : ""}</div>
      ${lv.warning ? `<div class="live-warn ${lv.warning.level}">${esc(lv.warning.label)}</div>` : ""}
      ${lv.no_card_driving ? `<div class="live-warn bad">Driving without your card inserted</div>` : ""}
      <div class="live-grid">
        ${leftStat(lf.driving_until_break, 30, "Driving before a break")}
        ${leftStat(lf.driving_left_today, 60, "Driving left today")}
        ${leftStat(lf.driving_left_week, 240, "Driving left this week")}
        ${leftStat(lf.until_daily_rest, 60, "Daily rest must start in")}
      </div>
      ${lv.activity === "rest" && lf.remaining_current_break ? `<p class="mut small" style="margin:10px 0 0">Break still needed: ${fmtMins(lf.remaining_current_break)}</p>` : ""}
      <p class="mut small" style="margin:10px 0 0">${lv.stale ? "Last update " + esc(fmtWhen(lv.recorded_at)) + " — the tracker may be out of signal. " : ""}A guide only: your tachograph is the official record.</p>
    </div>` : "";
  const inf = signoffs;
  const toSign = inf.filter((i) => i.needs_signature);
  const dayLabel = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short", timeZone: "UTC" });
  const bar = (d) => ["drive", "work", "available", "rest"].map((k) => d[k] ? `<i class="h-${k}" style="width:${Math.min(100, (d[k] / DAY_MIN) * 100)}%" title="${k} ${fmtMins(d[k])}"></i>` : "").join("");
  view.innerHTML = `${liveCard}
    <div class="card">
      <div class="row between"><div class="card-title" style="margin:0">${ICON.clock} Tachograph hours</div>
        ${t.last_card_download ? `<span class="mut small">Card read ${esc(fmtWhen(t.last_card_download))}</span>` : ""}</div>
      <div class="stat-grid" style="margin-top:12px">
        <div class="stat"><div class="n">${fmtMins(weekDriven)}</div><div class="l">Driving this week</div></div>
        <div class="stat"><div class="n">${fmtMins(weekLeft)}</div><div class="l">Left of 56h week</div></div>
        <div class="stat"><div class="n" style="color:${toSign.length ? "var(--d-bad)" : "var(--d-ok)"}">${toSign.length}</div><div class="l">To sign</div></div>
      </div>
      <p class="mut small" style="margin:10px 0 0">${lv || days.some((d) => d.live_minutes) ? "From your card downloads, plus live tachograph data since your last download." : "From your last driver card download — driving since then isn't included."}</p>
      <button class="btn btn-primary" id="hPdf" style="margin-top:12px">${ICON.doc} Download timeline PDF</button>
    </div>
    ${inf.length ? `<div class="section-title">Infringements${toSign.length ? ` <span class="chip chip-bad">${toSign.length} to sign</span>` : ""}</div><div class="card">${inf.map((i) => `<div class="fault-item">
        <span class="chip ${i.severity === "minor" ? "chip-warn" : "chip-bad"} square">${esc((i.severity || "issue").replace("_", " "))}</span>
        <span style="flex:1"><b>${esc(i.title)}</b><div class="mut small">${esc(fmtWhen(i.period_start))}${i.limit_minutes != null && i.actual_minutes != null ? ` · ${fmtMins(i.actual_minutes)} (limit ${fmtMins(i.limit_minutes)})` : ""}</div>
        ${i.detail ? `<div class="mut small">${esc(i.detail)}</div>` : ""}
        ${i.needs_signature ? `<button class="btn btn-primary btn-sm" data-sign="${esc(i.id)}" style="margin-top:8px;width:auto">Read &amp; sign</button>`
          : `<div class="small" style="margin-top:6px;color:var(--d-ok)">${ICON.okCircle} Signed ${esc(fmtWhen(i.review.driver_signed_at))}</div>`}
        ${i.review.debrief_action_label ? `<div class="mut small" style="margin-top:4px">Office: ${esc(i.review.debrief_action_label)}${i.review.debrief_notes ? " — " + esc(i.review.debrief_notes) : ""}</div>` : ""}
        </span></div>`).join("")}</div>` : ""}
    <div class="section-title">Last 28 days</div>
    <div class="card">
      <div class="hlegend"><span style="--c:#2563eb">Drive</span><span style="--c:#f59e0b">Other work</span><span style="--c:#8b5cf6">Available</span><span style="--c:#10b981">Rest</span></div>
      ${days.length ? days.map((d) => `<div class="hday"><span>${esc(dayLabel(d.date))}</span><div class="hbar">${bar(d)}</div>
          <span style="text-align:right;font-variant-numeric:tabular-nums" title="Driving">${d.drive ? fmtMins(d.drive) : "—"}${d.live_minutes ? '<div class="mut" style="font-size:10px">incl. live</div>' : ""}</span></div>`).join("")
        : `<div class="empty">No card activity in the last 28 days.</div>`}
    </div>`;
  $("#hPdf").onclick = (e) => busy(e.currentTarget, () => fetchAndOpen("api/driver/tacho/timeline.pdf?days=28", "my-tacho-timeline"));
  $$("[data-sign]").forEach((b) => { b.onclick = () => openSignInfringement(inf.find((i) => i.id === b.dataset.sign)); });
  if (lv) S.timers.push(setInterval(() => { if (location.hash.startsWith("#/hours") && !$("#sheet").classList.contains("open")) renderHours(); }, 60000));
}

function openSignInfringement(i) {
  if (!i) return;
  openSheet("Sign for infringement", `
    <div class="card" style="margin-top:12px">
      <span class="chip ${i.severity === "minor" ? "chip-warn" : "chip-bad"} square">${esc((i.severity || "issue").replace("_", " "))}</span>
      <div style="font-weight:700;margin-top:8px">${esc(i.title)}</div>
      <div class="mut small">${esc(fmtWhen(i.period_start))}${i.limit_minutes != null && i.actual_minutes != null ? ` · ${fmtMins(i.actual_minutes)} (limit ${fmtMins(i.limit_minutes)})` : ""}</div>
      ${i.detail ? `<p class="small" style="margin:8px 0 0">${esc(i.detail)}</p>` : ""}
    </div>
    <label class="lbl" for="sComment">Comment (optional)</label>
    <textarea class="input" id="sComment" maxlength="2000" placeholder="e.g. held up by an accident on the M6"></textarea>
    <div class="card-title" style="margin-top:12px">Your signature</div>
    <div class="sig-wrap"><canvas id="sSig"></canvas><button type="button" class="btn btn-soft btn-sm sig-clear" id="sSigClear">Clear</button></div>
    <div class="hint">I confirm I have been told about this infringement and understand the drivers' hours rules it relates to.</div>
    <button class="btn btn-primary" id="sSubmit" style="margin-top:12px">Sign</button>`, (sh) => {
    const pad = signaturePad($("#sSig", sh));
    $("#sSigClear", sh).onclick = pad.clear;
    $("#sSubmit", sh).onclick = (e) => busy(e.currentTarget, async () => {
      if (pad.isEmpty()) throw new Error("Sign in the box to confirm.");
      await api("POST", "api/driver/infringements/" + encodeURIComponent(i.id) + "/sign", { signature: pad.toDataURL(), comment: $("#sComment", sh).value || null });
      closeSheet();
      toast("Signed — thank you");
      try { await loadState(); } catch (err) {}
      renderHours();
    });
  });
}

  setTopbar({ title: "Contacts", avatar: true, bell: true }); setNav("contacts");
  const view = $("#view");
  view.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
  let list;
  try { list = await api("GET", "api/driver/contacts"); } catch (e) { return fail(e); }
  if (!location.hash.startsWith("#/contacts")) return;
  view.innerHTML = `<div class="card">${list.length ? list.map((c) => `<div class="list-item"><div class="avatar" style="display:grid;place-items:center;flex:none">${esc(initials(c.name))}</div>
      <div style="flex:1"><div style="font-weight:600">${esc(c.name)}</div><div class="mut small">${esc(c.role)}</div></div>
      ${c.phone ? `<a class="btn btn-soft btn-sm" style="text-decoration:none" href="tel:${esc(c.phone.replace(/[^\d+]/g, ""))}">Call</a>` : ""}</div>`).join("")
    : `<div class="empty">No contacts have been set up yet.<br>Ask your transport office for their number.</div>`}</div>`;

$("#bellBtn").onclick = () => {
  const pendingJobs = S.state && (S.state.jobs || []).some((j) => j.status === "pending");
  if (!pendingJobs && S.state && S.state.infringements_to_sign) { location.hash = "#/hours"; return; }
  if (!location.hash.startsWith("#/live")) { location.hash = "#/live"; return; }
  const first = $(".job.pending") || $(".section-title"); if (first) first.scrollIntoView({ behavior: "smooth", block: "start" });
};
