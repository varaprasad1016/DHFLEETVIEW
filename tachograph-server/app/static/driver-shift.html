<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>${title} — Driver Shift</title>
<style>
  :root { color-scheme: dark; --bg:#0b1220; --card:#131c2e; --line:#22304a; --fg:#e6edf7; --mut:#8aa0c0; --acc:#38bdf8; --ok:#34d399; --warn:#f59e0b; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:16px 18px 6px; display:flex; align-items:center; gap:12px; }
  header a { color:var(--acc); text-decoration:none; font-size:20px; }
  h1 { font-size:20px; margin:0; flex:1; }
  .status-badge { font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px; }
  .badge-in { background:var(--ok); color:#04121f; }
  .badge-break { background:var(--warn); color:#04121f; }
  main { padding:12px 16px 40px; max-width:600px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .card h2 { margin:0 0 12px; font-size:17px; display:flex; align-items:center; gap:8px; }
  label { display:block; font-size:13px; color:var(--mut); margin-bottom:4px; margin-top:10px; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#0e1624; color:var(--fg); font-size:15px; }
  input:focus, select:focus { border-color:var(--acc); outline:none; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .photo-row { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .photo-row img { width:80px; height:60px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .btn { display:block; width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; margin-top:14px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-green { background:var(--ok); color:#04121f; }
  .btn-red { background:var(--bad); color:#fff; }
  .btn-yellow { background:var(--warn); color:#04121f; }
  .btn-outline { background:transparent; border:1px solid var(--line); color:var(--fg); }
  .btn-sm { display:inline-block; width:auto; padding:8px 16px; font-size:13px; margin-top:0; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:12px 24px; border-radius:10px; font-weight:600; z-index:999; animation:fadeIn .3s; }
  .toast-ok { background:var(--ok); color:#04121f; }
  .toast-err { background:var(--bad); color:#fff; }
  @keyframes fadeIn { from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  .job-card { border-left:4px solid var(--acc); padding:12px; margin-top:8px; background:#0e1624; border-radius:0 8px 8px 0; }
  .job-card.urgent { border-left-color:var(--bad); }
  .job-actions { display:flex; gap:8px; margin-top:8px; }
  .hidden { display:none !important; }
  .driver-photo { width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <a href="compliance">←</a>
  <h1>Driver Shift</h1>
  <span class="status-badge hidden" id="statusBadge"></span>
</header>
<main>
  <!-- Driver Info -->
  <div class="card" id="driverCard">
    <h2>👤 Driver Information</h2>
    <label>Driver Name</label>
    <input id="driverName" placeholder="Enter your name" />
    <label>Vehicle Registration</label>
    <input id="vehicleReg" placeholder="e.g. AB12 CDE" />
  </div>

  <!-- Clock In Form -->
  <div class="card" id="clockInCard">
    <h2>▶ Clock In</h2>
    <div class="row">
      <div><label>Odometer (km)</label><input id="odometerIn" type="number" placeholder="e.g. 125000" /></div>
    </div>
    <div class="row">
      <div><label>Fuel Level %</label><input id="fuelIn" type="number" min="0" max="100" placeholder="e.g. 80" /></div>
      <div><label>AdBlue Level %</label><input id="adblueIn" type="number" min="0" max="100" placeholder="e.g. 60" /></div>
    </div>
    <label>📸 Odometer Photo</label>
    <div class="photo-row">
      <input type="file" accept="image/*" capture="environment" id="photoOdometer" onchange="previewPhoto(this,'prevOdo')" style="font-size:13px" />
      <img id="prevOdo" class="hidden" />
    </div>
    <label>📸 Fuel Level Photo</label>
    <div class="photo-row">
      <input type="file" accept="image/*" capture="environment" id="photoFuel" onchange="previewPhoto(this,'prevFuel')" style="font-size:13px" />
      <img id="prevFuel" class="hidden" />
    </div>
    <label>📸 AdBlue Level Photo</label>
    <div class="photo-row">
      <input type="file" accept="image/*" capture="environment" id="photoAdblue" onchange="previewPhoto(this,'prevAdBlue')" style="font-size:13px" />
      <img id="prevAdBlue" class="hidden" />
    </div>
    <button class="btn btn-green" id="clockInBtn" onclick="doClockIn()">▶ Start Shift</button>
  </div>

  <!-- Pending Jobs -->
  <div class="card hidden" id="jobsCard">
    <h2>📋 New Job Assignments</h2>
    <div id="jobsList"></div>
  </div>

  <!-- Active Shift -->
  <div class="card hidden" id="activeCard">
    <h2>⏱ Active Shift</h2>
    <p id="shiftInfo" style="color:var(--mut);font-size:13px"></p>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-yellow btn-sm" id="breakBtn" onclick="doBreak()">⏸ Take Break</button>
      <button class="btn btn-outline btn-sm hidden" id="endBreakBtn" onclick="doBreak()">▶ End Break</button>
    </div>
  </div>

  <!-- Active Jobs -->
  <div class="card hidden" id="activeJobsCard">
    <h2>📦 Active Jobs</h2>
    <div id="activeJobsList"></div>
  </div>

  <!-- Clock Out Form -->
  <div class="card hidden" id="clockOutCard">
    <h2>⏹ End Shift</h2>
    <div class="row">
      <div><label>Odometer Out (km)</label><input id="odometerOut" type="number" /></div>
    </div>
    <div class="row">
      <div><label>Fuel Level Out %</label><input id="fuelOut" type="number" min="0" max="100" /></div>
      <div><label>AdBlue Level Out %</label><input id="adblueOut" type="number" min="0" max="100" /></div>
    </div>
    <label>📸 Odometer Photo</label>
    <div class="photo-row">
      <input type="file" accept="image/*" capture="environment" id="photoOdometerOut" onchange="previewPhoto(this,'prevOdoOut')" style="font-size:13px" />
      <img id="prevOdoOut" class="hidden" />
    </div>
    <label>📸 Fuel Level Photo</label>
    <div class="photo-row">
      <input type="file" accept="image/*" capture="environment" id="photoFuelOut" onchange="previewPhoto(this,'prevFuelOut')" style="font-size:13px" />
      <img id="prevFuelOut" class="hidden" />
    </div>
    <label>📸 AdBlue Level Photo</label>
    <div class="photo-row">
      <input type="file" accept="image/*" capture="environment" id="photoAdblueOut" onchange="previewPhoto(this,'prevAdBlueOut')" style="font-size:13px" />
      <img id="prevAdBlueOut" class="hidden" />
    </div>
    <button class="btn btn-red" onclick="doClockOut()">⏹ End Shift</button>
  </div>
</main>
<script>
const API = '/api/shifts';
let activeShift = null;
let pollTimer = null;

function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }

function toast(msg, ok=true){
  const d = document.createElement('div');
  d.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3000);
}

function previewPhoto(input, imgId){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = $(imgId);
    img.src = e.target.result;
    img.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

// Resize & compress to max 800px wide, JPEG quality 0.6 — keeps payload < 100KB
function compressImage(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxW = 800;
        const ratio = Math.min(maxW / img.width, 1, maxW / img.height);
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function readFileAsDataURL(file){
  if(!file) return null;
  return compressImage(file);
}

async function api(method, path, body){
  const opts = { method, headers: {} };
  if(body){
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

// --- Clock In ---
async function doClockIn(){
  const name = $('driverName').value.trim();
  if(!name){ toast('Enter your name', false); return; }
  const btn = $('clockInBtn');
  btn.disabled = true; btn.textContent = 'Starting…';
  try {
    // Step 1: Clock in WITHOUT photos (small JSON body, avoids 502)
    const data = await api('POST', '/clock-in', {
      driver_name: name,
      vehicle_reg: $('vehicleReg').value.trim() || null,
      odometer_km: $('odometerIn').value ? parseInt($('odometerIn').value) : null,
      fuel_level_pct: $('fuelIn').value ? parseInt($('fuelIn').value) : null,
      adblue_level_pct: $('adblueIn').value ? parseInt($('adblueIn').value) : null,
      photos: [],
    });
    localStorage.setItem('shift_driver', name);
    activeShift = data;
    // Step 2: Upload photos separately via multipart (small files, no 502)
    for(const [type, inputId] of [['odometer_in','photoOdometer'],['fuel_in','photoFuel'],['adblue_in','photoAdblue']]){
      const file = $(inputId).files[0];
      if(file) await uploadPhoto(data.id, type, file);
    }
    toast('Clocked in!');
    updateUI();
    startPolling();
  } catch(e){ toast(e.message, false); }
  finally { btn.disabled = false; btn.textContent = '▶ Start Shift'; }
}

async function uploadPhoto(shiftId, photoType, file){
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(`${API}/${shiftId}/photos?photo_type=${photoType}`, { method: 'POST', body: fd });
  if(!res.ok) console.warn('Photo upload failed:', photoType, await res.text());
}

// --- Break ---
async function doBreak(){
  if(!activeShift) return;
  const isOnBreak = activeShift.status === 'on_break';
  try {
    await api('POST', `/${activeShift.id}/break`, { break_type: isOnBreak ? 'end' : 'start' });
    toast(isOnBreak ? 'Break ended' : 'Break started');
    await refreshShift();
  } catch(e){ toast(e.message, false); }
}

// --- Clock Out ---
async function doClockOut(){
  if(!activeShift) return;
  if(!confirm('End your shift?')) return;
  try {
    // Step 1: Clock out WITHOUT photos
    await api('POST', `/${activeShift.id}/clock-out`, {
      odometer_out_km: $('odometerOut').value ? parseInt($('odometerOut').value) : null,
      fuel_level_out_pct: $('fuelOut').value ? parseInt($('fuelOut').value) : null,
      adblue_level_out_pct: $('adblueOut').value ? parseInt($('adblueOut').value) : null,
      photos: [],
    });
    // Step 2: Upload photos separately
    for(const [type, inputId] of [['odometer_out','photoOdometerOut'],['fuel_out','photoFuelOut'],['adblue_out','photoAdblueOut']]){
      const file = $(inputId).files[0];
      if(file) await uploadPhoto(activeShift.id, type, file);
    }
    activeShift = null;
    toast('Shift ended!');
    updateUI();
    if(pollTimer) clearInterval(pollTimer);
  } catch(e){ toast(e.message, false); }
}

// --- Jobs ---
async function doAcceptJob(jobId){
  try { await api('POST', `/jobs/${jobId}/accept`); toast('Job accepted!'); await refreshJobs(); } catch(e){ toast(e.message, false); }
}
async function doDenyJob(jobId){
  const reason = prompt('Reason for denying (optional):');
  try { await api('POST', `/jobs/${jobId}/deny`, { reason }); toast('Job denied.'); await refreshJobs(); } catch(e){ toast(e.message, false); }
}
async function doCompleteJob(jobId){
  try { await api('POST', `/jobs/${jobId}/complete`); toast('Job completed!'); await refreshJobs(); } catch(e){ toast(e.message, false); }
}

// --- Refresh ---
async function refreshShift(){
  try {
    const active = await api('GET', '/active');
    activeShift = (active || []).find(s => s.driver_name === $('driverName').value.trim()) || null;
    updateUI();
  } catch(e){}
}

async function refreshJobs(){
  const name = $('driverName').value.trim();
  if(!name) return;
  try {
    const pending = await api('GET', `/jobs?status=pending&driver_name=${encodeURIComponent(name)}`);
    renderPendingJobs(pending || []);
  } catch(e){}
  if(activeShift){
    try {
      const detail = await api('GET', `/${activeShift.id}`);
      renderActiveJobs(detail.jobs || []);
    } catch(e){}
  }
}

function renderPendingJobs(jobs){
  const c = $('jobsList');
  if(!jobs.length){ hide('jobsCard'); return; }
  show('jobsCard');
  c.innerHTML = jobs.map(j => `
    <div class="job-card ${j.priority==='urgent'?'urgent':''}">
      <b>${esc(j.title)}</b>${j.vehicle_reg ? ` — ${esc(j.vehicle_reg)}` : ''}
      ${j.pickup_location ? `<div style="font-size:12px;color:var(--mut)">Pickup: ${esc(j.pickup_location)}</div>` : ''}
      ${j.dropoff_location ? `<div style="font-size:12px;color:var(--mut)">Drop-off: ${esc(j.dropoff_location)}</div>` : ''}
      <div class="job-actions">
        <button class="btn btn-green btn-sm" onclick="doAcceptJob('${j.id}')">Accept</button>
        <button class="btn btn-red btn-sm" onclick="doDenyJob('${j.id}')">Deny</button>
      </div>
    </div>
  `).join('');
}

function renderActiveJobs(jobs){
  const c = $('activeJobsList');
  if(!jobs.length){ hide('activeJobsCard'); return; }
  show('activeJobsCard');
  c.innerHTML = jobs.map(j => `
    <div class="job-card" style="border-left-color:${j.status==='completed'?'var(--mut)':'var(--ok)'}">
      <b>${esc(j.title)}</b>
      <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:${j.status==='accepted'?'var(--ok)':'var(--mut)'};color:#04121f;margin-left:6px">${j.status}</span>
      ${j.status==='accepted' ? `<button class="btn btn-outline btn-sm" style="margin-top:6px" onclick="doCompleteJob('${j.id}')">Complete</button>` : ''}
    </div>
  `).join('');
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// --- UI State ---
function updateUI(){
  const isClockedIn = activeShift && ['clocked_in','on_break','active'].includes(activeShift.status);
  const isOnBreak = activeShift && activeShift.status === 'on_break';

  if(isClockedIn){
    hide('clockInCard');
    show('activeCard');
    show('clockOutCard');
    $('shiftInfo').textContent = `Started: ${new Date(activeShift.clocked_in_at).toLocaleString()}`;
    const badge = $('statusBadge');
    badge.textContent = isOnBreak ? 'ON BREAK' : 'CLOCKED IN';
    badge.className = 'status-badge ' + (isOnBreak ? 'badge-break' : 'badge-in');
    show('statusBadge');
    $('breakBtn').classList.toggle('hidden', isOnBreak);
    $('endBreakBtn').classList.toggle('hidden', !isOnBreak);
  } else {
    show('clockInCard');
    hide('activeCard');
    hide('clockOutCard');
    hide('statusBadge');
    hide('jobsCard');
    hide('activeJobsCard');
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    await refreshShift();
    await refreshJobs();
  }, 15000);
}

// --- Init ---
(function init(){
  const saved = localStorage.getItem('shift_driver');
  if(saved) $('driverName').value = saved;
  refreshShift();
  refreshJobs();
})();
</script>
</body>
</html>
