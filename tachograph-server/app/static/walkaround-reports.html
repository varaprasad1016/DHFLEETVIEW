<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>${title} — Walkaround reports</title>
<style>
  :root{color-scheme:dark;--bg:#0b1220;--card:#131c2e;--line:#22304a;--fg:#e6edf7;--mut:#8aa0c0;--acc:#38bdf8;--ok:#34d399;--warn:#f59e0b;--bad:#f87171;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;}
  header{padding:16px;max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}
  h1{font-size:19px;margin:0;} a.back{color:var(--acc);text-decoration:none;font-size:13px;}
  main{padding:0 16px 60px;max-width:820px;margin:0 auto;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
  .filters div{display:flex;flex-direction:column;} label{font-size:11px;color:var(--mut);margin-bottom:3px;}
  input,select{background:var(--input);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px;font:inherit;}
  .btn{background:var(--acc);color:var(--on-acc);font-weight:700;border:none;border-radius:8px;padding:9px 15px;font:inherit;cursor:pointer;}
  .btn.small{background:transparent;color:var(--acc);border:1px solid var(--line);padding:5px 10px;font-size:12px;}
  .check{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .check .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;cursor:pointer;}
  .reg{font-weight:700;font-size:16px;}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;}
  .pass{background:var(--ok-soft);color:var(--ok);} .defects{background:var(--bad-soft);color:var(--bad);}
  .meta{color:var(--mut);font-size:12px;margin-top:3px;}
  .detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:none;}
  .detail.show{display:block;}
  .d{font-size:14px;margin:4px 0;} .sev{font-weight:700;text-transform:uppercase;font-size:11px;}
  .sev.dangerous{color:var(--bad);} .sev.major{color:var(--warn);} .sev.minor{color:var(--acc);}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .thumbs img{height:90px;border-radius:8px;border:1px solid var(--line);cursor:pointer;}
  .sig img{background:#fff;border-radius:8px;max-height:110px;margin-top:6px;border:1px solid var(--line);}
  .empty{color:var(--mut);padding:30px;text-align:center;}
  .lock{text-align:center;color:var(--mut);padding:40px 16px;} .lock a{color:var(--acc);}
  .lightbox{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<header><h1>Walkaround reports</h1><a class="back" href="compliance">← Compliance</a></header>
<main>
  <div id="lock" class="lock hidden">🔒 Locked. <a href="approver">Approve this month's licence</a> to view reports.</div>
  <div id="app" class="hidden">
    <div class="filters">
      <div><label>From</label><input type="date" id="start"></div>
      <div><label>To</label><input type="date" id="end"></div>
      <div><label>Registration</label><input id="reg" placeholder="any" autocapitalize="characters"></div>
      <div><label>Driver</label><input id="driver" placeholder="any"></div>
      <div><label>Check</label><select id="phase"><option value="">All checks</option><option value="pre_use">Pre-use</option><option value="end_of_day">End of day</option><option value="fault_report">Fault reports</option></select></div>
      <div><label>&nbsp;</label><button class="btn" id="go">Search</button></div>
    </div>
    <div id="list"></div>
  </div>
</main>
<div id="lightbox" class="lightbox hidden"><img id="lightimg"></div>
<script>
  const $=(id)=>document.getElementById(id);
  const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const dt=s=>s?new Date(s).toLocaleString('en-GB',{timeZone:'Europe/London'}):'';
  const PHASE={pre_use:'Pre-use check',end_of_day:'End of day check',fault_report:'Fault report'};
  const LEVEL=v=>({'empty':'empty','1/4':'¼','1/2':'½','3/4':'¾','full':'full'}[v]||v);
  const mins=s=>s<60?s+'s':Math.round(s/60)+' min';

  async function search(){
    const p=new URLSearchParams();
    if($('start').value)p.set('start',$('start').value);
    if($('end').value)p.set('end',$('end').value);
    if($('reg').value.trim())p.set('reg',$('reg').value.trim());
    if($('driver').value.trim())p.set('driver',$('driver').value.trim());
    if($('phase').value)p.set('phase',$('phase').value);
    p.set('limit','500');
    let rows;
    try{ const r=await fetch('api/walkaround/checks?'+p.toString(),{cache:'no-store'});
      if(r.status===401){ $('list').innerHTML='<div class="empty">Sign in to DH FleetView to see reports.</div>'; return; }
      if(r.status===403){ const b=await r.clone().json().catch(()=>null); if(b&&b.detail&&b.detail.error==='not_manager'){ $('list').innerHTML='<div class="empty">Your account can\'t view walkaround reports.</div>'; return; }
        $('app').classList.add('hidden'); $('lock').classList.remove('hidden'); return; }
      rows=await r.json(); }
    catch{ $('list').innerHTML='<div class="empty">Cannot reach service.</div>'; return; }
    if(!rows.length){ $('list').innerHTML='<div class="empty">No walkaround checks match.</div>'; return; }
    $('list').innerHTML=`<div class="meta" style="margin:0 0 8px">${rows.length} check${rows.length===1?'':'s'}${rows.length>=500?' (showing the latest 500 — narrow the dates)':''}</div>`;
    rows.forEach(c=>{
      const el=document.createElement('div'); el.className='check';
      el.innerHTML=`<div class="h">
          <span class="reg">${esc(c.vehicle_reg)}</span>
          <span class="meta" style="flex:1;margin-left:8px">${PHASE[c.phase]||'Walkaround'}</span>
          <span class="tag ${c.result}">${c.result==='pass'?'pass':'defects ('+c.defect_count+')'}</span>
        </div>
        <div class="meta">${dt(c.created_at)}${c.driver_name?' · '+esc(c.driver_name):''}${c.odometer_km?' · '+c.odometer_km+' km':''}
          ${c.fuel_level?' · fuel '+LEVEL(c.fuel_level):''}${c.adblue_level?' · AdBlue '+LEVEL(c.adblue_level):''}
          ${c.duration_seconds?' · took '+mins(c.duration_seconds):''}${c.safe_to_drive===false?' · <b style="color:var(--bad)">not safe to drive</b>':''}
          ${c.photo_count?' · 📷 '+c.photo_count:''}${c.has_signature?' · ✍ signed':''}</div>
        <div class="detail" id="det-${c.id}"></div>`;
      el.querySelector('.h').onclick=()=>toggle(c.id);
      $('list').appendChild(el);
    });
  }

  async function toggle(id){
    const box=$('det-'+id);
    if(box.classList.contains('show')){ box.classList.remove('show'); return; }
    box.classList.add('show'); box.innerHTML='Loading…';
    const c=await (await fetch('api/walkaround/checks/'+id,{cache:'no-store'})).json();
    let h='';
    if(c.location) h+=`<div class="meta">Location: ${esc(c.location)}</div>`;
    if(c.notes) h+=`<div class="meta">Notes: ${esc(c.notes)}</div>`;
    if(c.defects.length){
      h+='<div style="margin-top:6px">';
      c.defects.forEach(d=>{ h+=`<div class="d"><span class="sev ${d.severity}">${d.severity}</span> ${esc(d.item)}${d.description?' — '+esc(d.description):''} <span class="meta">(${d.status})</span></div>`; });
      h+='</div>';
    } else { h+='<div class="d" style="color:var(--ok)">All items OK.</div>'; }
    if(c.photos.length){
      h+='<div class="thumbs">'+c.photos.map(p=>`<img src="api/walkaround/photos/${p.id}" alt="${esc(p.item||'photo')}" title="${esc(p.item||'')}">`).join('')+'</div>';
    }
    if(c.has_signature){
      h+=`<div class="sig"><div class="meta" style="margin-top:8px">Driver signature</div><img src="api/walkaround/checks/${id}/signature"></div>`;
    }
    box.innerHTML=h;
    box.querySelectorAll('.thumbs img').forEach(im=>im.onclick=()=>{ $('lightimg').src=im.src; $('lightbox').classList.remove('hidden'); });
  }
  $('lightbox').onclick=()=>$('lightbox').classList.add('hidden');
  $('go').onclick=search;

  async function init(){
    let s; try{ s=await (await fetch('api/license/status',{cache:'no-store'})).json(); }catch{}
    if(!s||!s.licensed){ $('lock').classList.remove('hidden'); return; }
    $('app').classList.remove('hidden');
    // default: last 30 days
    const today=new Date(); const wk=new Date(Date.now()-29*86400000);
    $('end').value=today.toISOString().slice(0,10); $('start').value=wk.toISOString().slice(0,10);
    search();
  }
  init();
</script>
</body>
</html>
