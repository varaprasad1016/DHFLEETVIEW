# DH FleetView reverse proxy

<VirtualHost *:80>
    ServerName dhfleetview.co.uk
    ServerAlias www.dhfleetview.co.uk

    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/\.well-known/acme-challenge/
    RewriteRule ^ - [L]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    DocumentRoot "/cmsserver/apache2/htdocs"
    <Directory "/cmsserver/apache2/htdocs">
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName dhfleetview.co.uk
    ServerAlias www.dhfleetview.co.uk

    SSLEngine On
    SSLCertificateFile "/cmsserver/cert/dhfleetview/dhfleetview-chain.pem"
    SSLCertificateKeyFile "/cmsserver/cert/dhfleetview/dhfleetview-key.pem"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # --- Tacho licence server (phone approver + licence API) on :8000 ---
    # More specific than the "/" catch-all below, so it must precede it.
    RewriteEngine On
    RewriteRule ^/tacho/?$ /tacho/approver [R=302,L]
    # The Tacho Bridge App's MQTT over a WebSocket, so the app works where only
    # 443 is open (hosting firewall, depot networks). Must precede /tacho/.
    ProxyPass "/tacho/bridge/ws" "ws://127.0.0.1:8000/bridge/ws"
    ProxyPassReverse "/tacho/bridge/ws" "ws://127.0.0.1:8000/bridge/ws"
    ProxyPass "/tacho/" "http://127.0.0.1:8000/"
    ProxyPassReverse "/tacho/" "http://127.0.0.1:8000/"

    ProxyPass "/api/socket" "ws://127.0.0.1:8090/api/socket"
    ProxyPassReverse "/api/socket" "ws://127.0.0.1:8090/api/socket"
    ProxyPass "/" "http://127.0.0.1:8090/"
    ProxyPassReverse "/" "http://127.0.0.1:8090/"

    ErrorLog "logs/dhfleetview-error.log"
    CustomLog "logs/dhfleetview-access.log" combined
</VirtualHost>
