    <title>DH FleetView — Tracking &amp; Live View</title>
    <style>
      .loader {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background:
          radial-gradient(1000px 520px at 50% -5%, rgba(99, 102, 241, 0.18), transparent 60%),
          radial-gradient(820px 440px at 100% 105%, rgba(56, 189, 248, 0.12), transparent 60%),
          #0a0e17;
      }
      .loader-spinner {
        width: 54px; height: 54px; box-sizing: border-box; animation: ll 0.9s infinite linear;
        border-radius: 50%; border: 3px solid rgba(129, 140, 248, 0.18); border-top-color: #818cf8;
        box-shadow: 0 0 26px rgba(129, 140, 248, 0.35);
      }
      .loader-text {
        font-family: Inter, 'Segoe UI', Arial, sans-serif;
        font-weight: 700; font-size: 18px; letter-spacing: -0.2px; color: #e6eaf2;
      }
      .loader-tag {
        font-family: Inter, 'Segoe UI', Arial, sans-serif;
        font-weight: 700; font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
        color: #9aa4b5; margin-top: -8px;
      }
      @keyframes ll { to { transform: rotate(1turn); } }
    </style>
    <script type="module" crossorigin src="/assets/index-BgA0m9Qm.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bt3sjFji.css">

    <noscript>Enable JavaScript to use <a href="https://www.traccar.org/">Traccar GPS Tracking System</a>.</noscript>

    <div class="loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">DH FleetView</div>
      <div class="loader-tag">Fleet Command Center</div>
    </div>
  </body>
