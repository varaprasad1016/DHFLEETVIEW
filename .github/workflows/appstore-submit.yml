# One-click submission of the latest TestFlight build to App Store review.
#
# Prerequisites (one time, in App Store Connect, since only you can do these):
#   - Create the app version (e.g. 1.0) in "Prepare for Submission"
#   - Fill required metadata: screenshots, description, keywords, support URL
#   - Complete App Privacy (location data) and Age Rating
#   - App Review Information: a WORKING demo account (this app is login-gated)
# Then run this workflow; it selects the latest build and submits for review.

name: Submit to App Store

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit latest build for App Store review
        working-directory: traccar-manager
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: fastlane submit
