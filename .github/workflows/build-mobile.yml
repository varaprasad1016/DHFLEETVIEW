name: Build Mobile Apps

# Builds and publishes the DH FleetView mobile apps from GitHub-hosted runners.
# No local Mac is needed: the iOS job runs on a macOS runner.
#
#   Android -> Google Play, production track, draft status
#   iOS     -> TestFlight
#
# The asymmetry is Apple's, not ours. Google Play accepts an upload straight
# into a production draft that a human then rolls out. Apple requires review
# before anything reaches the App Store, so the equivalent "uploaded but not
# live" state is TestFlight. Promote a TestFlight build to the App Store from
# App Store Connect when you actually want a release.
#
# Both publish jobs skip themselves cleanly when their secrets are absent, so
# the workflow keeps producing downloadable artifacts before signing is set up.
#
# Setup: docs/IOS-PUBLISHING.md

on:
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches: [main, ios-app-store-publishing]
    tags: ['v*']

env:
  # Every store upload needs a build number higher than the last one accepted.
  # pubspec.yaml pins one, which is right for local builds and wrong for CI:
  # a second push would re-upload the same number and be rejected. The run
  # number is monotonic per repository; the offset clears build numbers already
  # used by hand (1.0.3+4 at the time of writing).
  BUILD_NUMBER_OFFSET: 100

jobs:
  ios:
    name: iOS (macOS runner)
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Get dependencies
        working-directory: traccar-manager
        run: flutter pub get

      - name: Disable experimental Swift Package Manager (use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Compute build number
        shell: bash
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET ))" >> "$GITHUB_ENV"

      - name: Check signing configured
        id: signing
        shell: bash
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present; building a signed .ipa"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets absent; building unsigned. See docs/IOS-PUBLISHING.md"
          fi

      # ---------------------------------------------------------------- signed

      - name: Import signing certificate
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          # A throwaway keychain, unlocked for this job only. The runner is
          # destroyed afterwards, but a dedicated keychain keeps the certificate
          # out of the login keychain and out of any other job's reach.
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$CERT_P12" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/dist.p12

          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > /tmp/profile.mobileprovision

          # Xcode finds profiles by UUID, and the export options need the name.
          # Both live inside the profile, so read them rather than asking anyone
          # to keep a second copy in sync.
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)

          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $NAME ($UUID)"

      - name: Force manual signing for the archive
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The Xcode project leaves CODE_SIGN_STYLE unset, so it defaults to
          # automatic, and sets CODE_SIGN_IDENTITY to "iPhone Developer". Both
          # are right for someone building in Xcode on their own Mac and wrong
          # here: automatic signing needs a signed-in Xcode account this runner
          # does not have, and a development identity cannot sign an App Store
          # archive.
          #
          # Overriding through Flutter's Release xcconfig rather than editing
          # the project keeps local development on automatic signing, which is
          # what anyone opening the project in Xcode will want.
          cat >> traccar-manager/ios/Flutter/Release.xcconfig <<XCCONFIG

          // Added by CI for App Store signing; not committed.
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          XCCONFIG
          tail -8 traccar-manager/ios/Flutter/Release.xcconfig

      - name: Write export options
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # method app-store-connect is the Xcode 15.3+ spelling. On an older
          # Xcode this value must be "app-store" instead.
          cat > traccar-manager/ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.dhgroup.fleetview</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          cat traccar-manager/ios/ExportOptions.plist

      - name: Build signed .ipa
        if: steps.signing.outputs.signed == 'true'
        working-directory: traccar-manager
        run: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload signed .ipa
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DH-FleetView-iOS
          path: traccar-manager/build/ios/ipa/*.ipa
          if-no-files-found: error

      # -------------------------------------------------------------- unsigned

      - name: Build iOS (unsigned)
        if: steps.signing.outputs.signed != 'true'
        working-directory: traccar-manager
        run: flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"

      - name: Package unsigned .ipa
        if: steps.signing.outputs.signed != 'true'
        working-directory: traccar-manager
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r DH-FleetView.ipa Payload
          rm -rf Payload

      - name: Upload unsigned .ipa
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DH-FleetView-iOS-unsigned
          path: traccar-manager/DH-FleetView.ipa
          if-no-files-found: error

  android:
    name: Android (AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Get dependencies
        working-directory: traccar-manager
        run: flutter pub get

      - name: Compute build number
        shell: bash
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET ))" >> "$GITHUB_ENV"

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing repository secret: KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing repository secret: KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing repository secret: KEY_PASSWORD}"
          echo "All signing secrets present"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p environment
            echo "$KEYSTORE_BASE64" | base64 -d > environment/dhfleetview.keystore
            echo "KEYSTORE_PRESENT=1" >> "$GITHUB_ENV"
          fi

      - name: Build AAB (release)
        working-directory: traccar-manager
        env:
          KEY_ALIAS: dhfleetview
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_FILE: ${{ github.workspace }}/environment/dhfleetview.keystore
        run: flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Build APK (release, sideload)
        working-directory: traccar-manager
        env:
          KEY_ALIAS: dhfleetview
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_FILE: ${{ github.workspace }}/environment/dhfleetview.keystore
        run: flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DH-FleetView-Android
          path: traccar-manager/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DH-FleetView-Android-APK
          path: traccar-manager/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish-play:
    name: Publish to Google Play
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check publishing configured
        id: check
        shell: bash
        run: |
          if [ -z "${{ secrets.SERVICE_ACCOUNT_JSON }}" ]; then
            echo "SERVICE_ACCOUNT_JSON secret not configured; skipping publish"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Download AAB
        if: env.SKIP != '1'
        uses: actions/download-artifact@v4
        with:
          name: DH-FleetView-Android

      - name: Upload to Google Play (production draft)
        if: env.SKIP != '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlaintext: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.dhgroup.fleetview
          releaseFiles: app-release.aab
          track: production
          status: draft

  publish-testflight:
    name: Publish to TestFlight
    runs-on: macos-latest
    needs: ios
    if: >-
      needs.ios.outputs.signed == 'true' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/ios-app-store-publishing' ||
       github.ref_type == 'tag' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - name: Check publishing configured
        shell: bash
        run: |
          if [ -z "${{ secrets.APPSTORE_ISSUER_ID }}" ] \
            || [ -z "${{ secrets.APPSTORE_KEY_ID }}" ] \
            || [ -z "${{ secrets.APPSTORE_PRIVATE_KEY }}" ]; then
            echo "App Store Connect API key secrets not configured; skipping publish"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Download .ipa
        if: env.SKIP != '1'
        uses: actions/download-artifact@v4
        with:
          name: DH-FleetView-iOS
          path: ipa

      - name: Locate the .ipa
        if: env.SKIP != '1'
        shell: bash
        run: |
          # The file is named after the Xcode product, currently "Runner". That
          # is a project setting somebody may reasonably rename, so find it
          # rather than hard-coding a name the build would silently outgrow.
          IPA=$(find ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "No .ipa found in the downloaded artifact" >&2
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Uploading $IPA"

      - name: Upload to TestFlight
        if: env.SKIP != '1'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
