name: Build Mobile Apps

# Builds the DH FleetView Android AAB and iOS app on GitHub-hosted runners.
# iOS requires a macOS runner (Xcode) - no local Mac needed.
# Android AAB is signed with the upload keystore from repo secrets and,
# auto-published to Google Play (production, draft) on every push to main,
# tag, or manual dispatch.

on:
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches: [main]
    tags: ['v*']

jobs:
  ios:
    name: iOS (macOS runner)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Get dependencies
        working-directory: traccar-manager
        run: flutter pub get

      - name: Disable experimental Swift Package Manager (use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Compute build number
        shell: bash
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + BUILD_NUMBER_OFFSET ))" >> "$GITHUB_ENV"

      - name: Check signing configured
        id: signing
        shell: bash
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$ASC_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect API key present; building a signed .ipa (automatic signing)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "API key secrets absent; building unsigned."
          fi

      # -------- signed: App Store Connect API key + automatic signing --------

      - name: Set up App Store Connect API key
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KEY_DIR="$RUNNER_TEMP/asc_private_keys"
          mkdir -p "$KEY_DIR" ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          cp "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" ~/.appstoreconnect/private_keys/
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Write export options
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          cat > traccar-manager/ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>ZAWG6D59DU</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          cat traccar-manager/ios/ExportOptions.plist

      - name: Build and export signed .ipa
        if: steps.signing.outputs.signed == 'true'
        working-directory: traccar-manager
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"

          rm -rf build/ios/archive build/ios/ipa
          mkdir -p build/ios/archive build/ios/ipa
          ARCHIVE_PATH="$PWD/build/ios/archive/Runner.xcarchive"
          EXPORT_PATH="$PWD/build/ios/ipa"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=ZAWG6D59DU

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Locate the signed .ipa
        if: steps.signing.outputs.signed == 'true'
        run: echo "IPA_PATH=$(ls traccar-manager/build/ios/ipa/*.ipa | head -1)" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_KEY }}

      - name: Upload signed .ipa (best effort; skipped when artifact storage is full)
        if: steps.signing.outputs.signed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DH-FleetView-iOS
          path: traccar-manager/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 5

      # -------------------------------------------------------------- unsigned

      - name: Build iOS (unsigned)
        if: steps.signing.outputs.signed != 'true'
        working-directory: traccar-manager
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        if: steps.signing.outputs.signed != 'true'
        working-directory: traccar-manager
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r DH-FleetView.ipa Payload
          rm -rf Payload

      - name: Upload .ipa
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DH-FleetView-iOS
          path: traccar-manager/DH-FleetView.ipa
          if-no-files-found: error
          retention-days: 5

  android:
    name: Android (AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Get dependencies
        working-directory: traccar-manager
        run: flutter pub get

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing repository secret: KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing repository secret: KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing repository secret: KEY_PASSWORD}"
          echo "All signing secrets present"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p environment
            echo "$KEYSTORE_BASE64" | base64 -d > environment/dhfleetview.keystore
            echo "KEYSTORE_PRESENT=1" >> "$GITHUB_ENV"
          fi

      - name: Build AAB (release)
        working-directory: traccar-manager
        env:
          KEY_ALIAS: dhfleetview
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_FILE: ${{ github.workspace }}/environment/dhfleetview.keystore
        run: flutter build appbundle --release

      - name: Build APK (release, sideload)
        working-directory: traccar-manager
        env:
          KEY_ALIAS: dhfleetview
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_FILE: ${{ github.workspace }}/environment/dhfleetview.keystore
        run: flutter build apk --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: DH-FleetView-Android
          path: traccar-manager/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DH-FleetView-Android-APK
          path: traccar-manager/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 5

  publish-play:
    name: Publish to Google Play
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check publishing configured
        id: check
        shell: bash
        run: |
          if [ -z "${{ secrets.SERVICE_ACCOUNT_JSON }}" ]; then
            echo "SERVICE_ACCOUNT_JSON secret not configured; skipping publish"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Download AAB
        if: env.SKIP != '1'
        uses: actions/download-artifact@v4
        with:
          name: DH-FleetView-Android

      - name: Upload to Google Play (production draft)
        if: env.SKIP != '1'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlaintext: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.dhgroup.fleetview
          releaseFiles: app-release.aab
          track: production
          status: draft
